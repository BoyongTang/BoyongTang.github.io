     aria-labelledby="title desc">
  <title id="title">星环雪峰与银河之夜（纯 SVG 路径重绘版）</title>
  <desc id="desc">深蓝星空、斜向银河、金色环、雪山、星芒和曲面网格的纯矢量 SVG 重绘。没有嵌入位图。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0" stop-color="#06152f"/>
      <stop offset="0.52" stop-color="#0a2450"/>
      <stop offset="1" stop-color="#031735"/>
    </linearGradient>
    <radialGradient id="skyGlow" cx="54%" cy="63%" r="66%">
      <stop offset="0" stop-color="#315d9e" stop-opacity=".48"/>
      <stop offset=".48" stop-color="#123669" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00112b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="galaxy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f8fce" stop-opacity="0"/>
      <stop offset=".28" stop-color="#83a3e8" stop-opacity=".44"/>
      <stop offset=".52" stop-color="#ffd0a3" stop-opacity=".88"/>
      <stop offset=".7" stop-color="#c789c9" stop-opacity=".6"/>
